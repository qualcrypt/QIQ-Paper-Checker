name: Deploy QIQ to a VPS

# Manual trigger only (Actions tab → Run workflow). The primary hosting path
# is Render (render.yaml), which auto-deploys from GitHub natively — this
# workflow exists for the self-hosted VPS option in docs/DEPLOYMENT.md.
# Requires repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull, rebuild and restart on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/qiq
            git fetch origin main
            git reset --hard origin/main
            npm install            # postinstall runs `vite build`
            pm2 restart qiq
            echo "Deployed $(git rev-parse --short HEAD)"
